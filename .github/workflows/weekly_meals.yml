name: Weekly Dinner Ideas

on:
  schedule:
    - cron: '0 18 * * 0'  # Neff Family — Sunday 6:00pm UTC
    - cron: '5 18 * * 0'  # Hodge Family — Sunday 6:05pm UTC
  workflow_dispatch:       # Allow manual trigger from GitHub UI (sends to every household)

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Debug email config
        env:
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          echo "Sender: $GMAIL_SENDER"
          echo "Password length: ${#GMAIL_APP_PASSWORD}"
      - name: Ping healthchecks.io (start)
        run: curl -fsS -m 10 --retry 3 "${{ secrets.HEALTHCHECKS_URL }}/start" || true
      - name: Determine household for this trigger
        id: household
        run: |
          case "${{ github.event.schedule }}" in
            "0 18 * * 0") echo "names=Neff Family" >> "$GITHUB_OUTPUT" ;;
            "5 18 * * 0") echo "names=Hodge Family" >> "$GITHUB_OUTPUT" ;;
            *) echo "names=" >> "$GITHUB_OUTPUT" ;;
          esac
      - run: python scripts/generate_meals.py
        env:
          HOUSEHOLD_NAMES: ${{ steps.household.outputs.names }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          SPOONACULAR_API_KEY: ${{ secrets.SPOONACULAR_API_KEY }}
      - name: Ping healthchecks.io (success)
        if: success()
        run: curl -fsS -m 10 --retry 3 "${{ secrets.HEALTHCHECKS_URL }}" || true
      - name: Ping healthchecks.io (failure)
        if: failure()
        run: curl -fsS -m 10 --retry 3 "${{ secrets.HEALTHCHECKS_URL }}/fail" || true